<!DOCTYPE html>
<html>
<head>
    <title>Debug API</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Debug API</h1>
    
    <button onclick="testRaw()">Test Raw Request</button>
    <button onclick="testDebug()">Test Debug</button>
    
    <h2>Response:</h2>
    <pre id="response">Waiting...</pre>

    <script>
        async function testRaw() {
            try {
                const response = await fetch('./index.php/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@escuela.com',
                        password: 'admin123'
                    })
                });
                
                console.log('Status:', response.status);
                console.log('Content-Type:', response.headers.get('content-type'));
                
                const text = await response.text();
                console.log('Raw text length:', text.length);
                console.log('Raw text:', text);
                
                document.getElementById('response').textContent = 'Status: ' + response.status + '\n\nRaw Response:\n' + text;
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message + '\n' + error.stack;
            }
        }

        async function testDebug() {
            try {
                const response = await fetch('./index.php/debug', {
                    method: 'GET'
                });
                
                const text = await response.text();
                document.getElementById('response').textContent = text;
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
