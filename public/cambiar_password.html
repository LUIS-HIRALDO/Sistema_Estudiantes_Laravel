<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Sistema de Estudiantes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .container p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        form {
            display: grid;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }

        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cambiar Contraseña</h1>
        <p>Por seguridad, debes cambiar tu contraseña antes de continuar.</p>
        
        <div id="alert" class="alert"></div>

        <form id="changePasswordForm">
            <input type="password" id="password" placeholder="Nueva Contraseña" required minlength="6">
            <input type="password" id="confirm_password" placeholder="Confirmar Nueva Contraseña" required minlength="6">
            <button type="submit">Actualizar Contraseña</button>
        </form>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = './login.html';
        }

        const baseUrl = './index.php';

        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const alert = document.getElementById('alert');

            if (password !== confirmPassword) {
                alert.textContent = 'Las contraseñas no coinciden';
                alert.className = 'alert alert-error';
                alert.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${baseUrl}/auth/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert.textContent = 'Contraseña actualizada correctamente. Redirigiendo...';
                    alert.className = 'alert alert-success';
                    alert.style.display = 'block';
                    
                    setTimeout(() => {
                        // Redirigir según el rol guardado en localStorage o decodificado del token
                        // Por simplicidad, vamos al panel de profesor si es profesor
                        // O mejor, volvemos al login para que inicie sesión limpio, o directo al panel.
                        // Vamos directo al panel.
                        const user = JSON.parse(localStorage.getItem('user') || '{}');
                        if (user.rol === 'profesor') {
                            window.location.href = './panel_profesor.html';
                        } else {
                            window.location.href = './index.html'; // Fallback
                        }
                    }, 2000);
                } else {
                    alert.textContent = data.error || 'Error al actualizar contraseña';
                    alert.className = 'alert alert-error';
                    alert.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                alert.textContent = 'Error de conexión';
                alert.className = 'alert alert-error';
                alert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
